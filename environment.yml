name: bageti

channels:
  - conda-forge
  - bioconda

dependencies:
  # ---------------------------------------------------------------------------
  # R runtime
  # ---------------------------------------------------------------------------
  - r-base=4.3.1

  # ---------------------------------------------------------------------------
  # BAGETI core: R/C++ interface, parallelization, and spatial line extraction
  # ---------------------------------------------------------------------------
  - r-rcpp=1.1.0
  - r-rcpparmadillo=15.0.2_1
  - r-doparallel=1.0.17
  - r-foreach=1.5.2
  - r-abind=1.4_5
  - r-dbscan=1.2.3

  # Compiler toolchain required by Rcpp::sourceCpp()
  - cxx-compiler
  - make

  # ---------------------------------------------------------------------------
  # Spatial transcriptomics data handling used by Example.ipynb
  # ---------------------------------------------------------------------------
  - r-seurat=5.3.0
  - r-hdf5r=1.3.12
  - r-matrix=1.6_5
  - r-fnn=1.1.4.1

  # ---------------------------------------------------------------------------
  # Data manipulation
  # ---------------------------------------------------------------------------
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-readr=2.1.5
  - r-jsonlite=2.0.0
  - r-igraph=2.1.4

  # ---------------------------------------------------------------------------
  # Visualization
  # ---------------------------------------------------------------------------
  - r-ggplot2=3.5.2
  - r-viridis=0.6.5
  - r-gridextra=2.3
  - r-patchwork=1.3.2
  - r-png=0.1_8

  # ---------------------------------------------------------------------------
  # Spatial/vector-field plotting used by the current BAGETI workflow
  # ---------------------------------------------------------------------------
  - r-sf=1.0_14
  - r-sp=2.2_0
  - r-concaveman=1.1.0

  # ---------------------------------------------------------------------------
  # Jupyter support
  # ---------------------------------------------------------------------------
  - r-irkernel=1.3.2
  - jupyterlab=4
